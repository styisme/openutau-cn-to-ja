<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZH to JA 配置编辑器</title>
<style>
:root{--bg:#1e1e1e;--panel:#252526;--border:#3c3c3c;--text:#d4d4d4;--dim:#888;--accent:#4ec9b0;--accent2:#569cd6;--warn:#ce9178;--err:#f48771}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;color:var(--accent)}
header .sub{color:var(--dim);font-size:12px}
header .actions{margin-left:auto;display:flex;gap:6px}
main{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 50px)}
@media(max-width:900px){main{grid-template-columns:1fr}}
.editor{border-right:1px solid var(--border);padding:12px;overflow-y:auto}
.preview{padding:12px;overflow-y:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 12px;cursor:pointer;background:none;border:none;color:var(--dim);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none}
.pane.active{display:block}
.field{margin-bottom:12px}
.field label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:Consolas,monospace;font-size:13px;border-radius:3px}
.field textarea{min-height:240px;resize:vertical}
.field input[type=checkbox]{margin-right:6px}
.hint{color:var(--dim);font-size:11px;margin-top:4px;line-height:1.5}
button.btn{padding:6px 12px;border-radius:3px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:12px}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.kv-table{width:100%;border-collapse:collapse;font-family:Consolas,monospace;font-size:12px}
.kv-table th,.kv-table td{padding:3px 6px;border-bottom:1px solid var(--border);text-align:left}
.kv-table th{color:var(--dim);font-weight:normal;font-size:11px}
.kv-table input{width:100%;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:inherit;padding:2px}
.kv-table input:focus{outline:1px solid var(--accent2)}
.kv-table .del{cursor:pointer;color:var(--dim);padding:0 4px}
.kv-table .del:hover{color:var(--err)}
.kv-add{margin-top:6px}
h2{font-size:13px;color:var(--accent);margin:14px 0 8px}
.result{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:10px;font-family:Consolas,monospace;font-size:13px;line-height:1.8;min-height:60px;white-space:pre-wrap;word-break:break-all}
.result .phoneme{color:var(--accent)}
.result .rule{color:var(--warn)}
.result .err{color:var(--err)}
.result .sep{color:var(--dim);margin:0 4px}
.toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.status{color:var(--dim);font-size:11px;align-self:center}
</style>
</head>
<body>
<header>
  <h1>ZH to JA 配置编辑器</h1>
  <span class="sub">v2.3.0 · 单文件离线工具</span>
  <div class="actions">
    <button class="btn" id="btn-import">导入 YAML</button>
    <button class="btn primary" id="btn-export">导出 YAML</button>
    <input type="file" id="file-input" accept=".yaml,.yml" style="display:none">
  </div>
</header>
<main>
<div class="editor">
  <div class="tabs">
    <button class="tab active" data-pane="basic">基础开关</button>
    <button class="tab" data-pane="fullpinyin">拼音映射</button>
    <button class="tab" data-pane="polyphone">多音字</button>
    <button class="tab" data-pane="alias">别名覆盖</button>
    <button class="tab" data-pane="yaml">YAML</button>
  </div>

  <div class="pane active" data-pane="basic">
    <div class="field">
      <label>nasal_mode — 鼻音韵尾处理</label>
      <select id="cfg-nasal-mode">
        <option value="none">none — 完全省略「ん」</option>
        <option value="short">short — 只占末尾固定毫秒（默认）</option>
        <option value="full">full — 保留完整采样</option>
      </select>
    </div>
    <div class="field">
      <label>nasal_ms — short 模式下「ん」占音符末尾毫秒</label>
      <input type="number" id="cfg-nasal-ms" value="120" min="30" max="500">
    </div>
    <div class="field"><label><input type="checkbox" id="cfg-use-wildcard"> use_wildcard — 通配符 * 过渡音素</label></div>
    <div class="field"><label><input type="checkbox" id="cfg-disable-vcv"> disable_vcv — 禁用 VCV 过渡</label></div>
    <div class="field"><label><input type="checkbox" id="cfg-disable-light-tone"> disable_light_tone — 禁用轻声压缩</label></div>
    <div class="field"><label><input type="checkbox" id="cfg-disable-tone-timing"> disable_tone_timing — 禁用声调时长微调</label></div>
    <div class="field"><label><input type="checkbox" id="cfg-disable-double-char"> disable_double_char — 禁用叠字缩短</label></div>
  </div>

  <div class="pane" data-pane="fullpinyin">
    <p class="hint">键=拼音，值=罗马字 mora 序列（空格分隔）。例：<code>hua → fa</code></p>
    <table class="kv-table" id="tbl-fullpinyin">
      <thead><tr><th>拼音</th><th>mora 序列</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="kv-add"><button class="btn" id="btn-add-fullpinyin">+ 添加</button></div>
  </div>

  <div class="pane" data-pane="polyphone">
    <p class="hint">键=原始词组（空格分隔拼音），值=修正后。例：<code>"chang da" → "zhang da"</code></p>
    <table class="kv-table" id="tbl-polyphone">
      <thead><tr><th>原始词组</th><th>修正为</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="kv-add"><button class="btn" id="btn-add-polyphone">+ 添加</button></div>
  </div>

  <div class="pane" data-pane="alias">
    <p class="hint">键=目标假名，值=候选别名（逗号分隔）。例：<code>"ん" → ["ん -", "n -", "n"]</code></p>
    <table class="kv-table" id="tbl-alias">
      <thead><tr><th>假名</th><th>候选（逗号分隔）</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="kv-add"><button class="btn" id="btn-add-alias">+ 添加</button></div>
  </div>

  <div class="pane" data-pane="yaml">
    <p class="hint">直接编辑完整 YAML。</p>
    <div class="toolbar">
      <button class="btn" id="btn-apply-yaml">YAML → 表单</button>
      <button class="btn" id="btn-refresh-yaml">表单 → YAML</button>
      <span class="status" id="yaml-status"></span>
    </div>
    <div class="field"><textarea id="yaml-editor" spellcheck="false"></textarea></div>
  </div>
</div>

<div class="preview">
  <h2>实时预览</h2>
  <div class="field">
    <input type="text" id="preview-input" placeholder="拼音，空格分隔。例：ni hao shi jie 2024" value="ni hao shi jie 2024">
  </div>
  <div class="hint" style="margin-bottom:10px;">输入拼音（不是汉字）。多音字需要连续音节才能匹配。</div>
  <h2>输出音素序列</h2>
  <div class="result" id="preview-output"></div>
  <h2>匹配说明</h2>
  <div class="result" id="preview-rules" style="min-height:30px;font-size:12px"></div>
</div>
</main>

// ============ 2. 核心逻辑 ============
function parsePinyin(p){p=(p||"").replace(/[^a-z]/g,"").toLowerCase();if(!p)return null;
if(p==="n"||p==="ng")return["N"];if(p==="zh")p="zhi";else if(p==="ch")p="chi";else if(p==="sh")p="shi";
if(p[0]==="y"){var r=p.slice(1);if(r==="i"||r==="in"||r==="ing")return[r];
if(r[0]==="u"){var a="v"+r.slice(1);return FINALS.indexOf(a)>=0?[a]:null;}
return FINALS.indexOf(r)>=0?["y",r]:null;}
if(p[0]==="w"){var r=p.slice(1);if(r==="u")return["u"];return FINALS.indexOf(r)>=0?["w",r]:null;}
if(FINALS.indexOf(p)>=0)return[p];
for(var i=0;i<INITIALS.length;i++){var init=INITIALS[i];
if(p.indexOf(init)===0){var rem=p.slice(init.length);if(FINALS.indexOf(rem)>=0)return[init,rem];}}
return null;}

function getVowelSeq(f){var m={a:["a"],o:["o"],e:["e"],i:["i"],u:["u"],v:["yu"],er:["a"],ai:["a","i"],ei:["e","i"],ao:["a","o"],ou:["o","o"],an:["a","N"],en:["e","N"],in:["i","N"],un:["u","N"],ang:["a","N"],eng:["e","N"],ing:["i","N"],ong:["o","N"],ian:["i","e","N"],iang:["i","a","N"],iong:["i","o","N"],uan:["u","a","N"],uang:["u","a","N"],ueng:["u","e","N"],van:["yu","e","N"],vn:["yu","N"],ia:["i","a"],ie:["i","e"],iu:["i","u"],iao:["i","a","o"],ua:["u","a"],uo:["u","o"],ui:["u","i"],uai:["u","a","i"],ue:["yu","e"],ve:["yu","e"]};return m[f]||[f];}

function toKana(r){return r?(R2K[r]||r):r;}

function genMoras(cc,final,fpMap){var moras=[];var ri=(cc&&cc.length>0)?cc[0]:"";var fp=ri+final;
if(fpMap[fp]){return fpMap[fp].map(toKana);}
var cons="";if(cc&&cc.length>0)cons=IMAP[cc[0]]||cc[0];
var vs=getVowelSeq(final);if(vs.length===0)return moras;
if(cons){var fv=vs.shift();if(fv==="N"){moras.push(toKana(cons+"u"));moras.push("ん");}else moras.push(toKana(cons+fv));}
for(var i=0;i<vs.length;i++){if(vs[i]==="N")moras.push("ん");else moras.push(toKana(vs[i]));}
return moras;}

function convVowel(f){if(!f)return"-";if(f==="-"||f==="R")return f;var s=getVowelSeq(f);
if(s.length){var last=s[s.length-1];if(last==="N")return"n";return last[last.length-1];}return f[f.length-1];}

function hasKana(s){return/[\u3040-\u309F\u30A0-\u30FF\uFF66-\uFF9D]/.test(s);}

// ============ 3. 状态 ============
var config={nasal_mode:"short",nasal_ms:120,use_wildcard:true,disable_vcv:false,disable_light_tone:false,disable_tone_timing:false,disable_double_char:false,full_pinyin:{},polyphones:{},alias_overrides:{}};

function getFPMap(){var m={};for(var k in DFPM)m[k]=DFPM[k];for(var k in config.full_pinyin)m[k]=config.full_pinyin[k];return m;}
function getPMap(){var m={};for(var k in DPM)m[k]=DPM[k];for(var k in config.polyphones)m[k]=config.polyphones[k];return m;}

// ============ 4. 简易 YAML ============
function yamlParse(text){var result={};var lines=text.split(/\r?\n/);var curKey=null,curIndent=0;
function stripComment(s){var inStr=false,q="";
for(var i=0;i<s.length;i++){var c=s[i];
if((c==='"'||c==="'")&&s[i-1]!=="\\"){if(!inStr){inStr=true;q=c;}else if(q===c){inStr=false;}}
else if(c==="#"&&!inStr){return s.slice(0,i).trim();}}return s.trim();}
function pv(v){v=v.trim();if(!v||v==="null"||v==="~")return null;
if(v==="true")return true;if(v==="false")return false;
if(/^-?\d+$/.test(v))return parseInt(v,10);if(/^-?\d+\.\d+$/.test(v))return parseFloat(v);
if(v[0]==="["&&v[v.length-1]==="]"){var inner=v.slice(1,-1).trim();if(!inner)return[];return inner.split(",").map(function(x){return pv(x.trim());});}
if((v[0]==='"'&&v[v.length-1]==='"')||(v[0]==="'"&&v[v.length-1]==="'"))return v.slice(1,-1);
return v;}
for(var li=0;li<lines.length;li++){var line=lines[li];
if(!line.trim()||line.trim()[0]==="#")continue;
line=line.replace(/\t/g,"    ");var indent=line.match(/^ */)[0].length;
var trimmed=stripComment(line);if(!trimmed)continue;
var ci=-1,inStr=false,q="";
for(var i=0;i<trimmed.length;i++){var c=trimmed[i];
if((c==='"'||c==="'")&&trimmed[i-1]!=="\\"){if(!inStr){inStr=true;q=c;}else if(q===c){inStr=false;}}
else if(c===":"&&!inStr){ci=i;break;}}
if(ci<0)continue;var key=trimmed.slice(0,ci).trim();var vs=trimmed.slice(ci+1).trim();
if((key[0]==='"'&&key[key.length-1]==='"')||(key[0]==="'"&&key[key.length-1]==="'"))key=key.slice(1,-1);
if(vs===""){curKey=key;curIndent=indent;result[key]={};}
else if(curKey!==null&&indent>curIndent){result[curKey][key]=pv(vs);}
else{curKey=null;result[key]=pv(vs);}}
return result;}

function yamlDump(obj){var lines=[];
function nq(s){if(typeof s!=="string")return false;
return/[:#\[\]{},&*!|>'"%@`]/.test(s)||/^\s|\s$/.test(s)||/^(true|false|null|~|\d+|\d+\.\d+)$/.test(s);}
function fv(v){if(v===null||v===undefined)return"~";
if(typeof v==="boolean")return v?"true":"false";
if(typeof v==="number")return String(v);
if(typeof v==="string"){if(nq(v))return'"'+v.replace(/"/g,'\\"')+'"';return v;}
if(Array.isArray(v))return"["+v.map(fv).join(", ")+"]";return String(v);}
function fk(k){if(nq(k))return'"'+k.replace(/"/g,'\\"')+'"';return k;}
var simple=[],nested=[];
for(var k in obj){if(obj[k]&&typeof obj[k]==="object"&&!Array.isArray(obj[k]))nested.push(k);else simple.push(k);}
for(var i=0;i<simple.length;i++)lines.push(fk(simple[i])+": "+fv(obj[simple[i]]));
for(var i=0;i<nested.length;i++){var k=nested[i];lines.push(fk(k)+":");
for(var sk in obj[k])lines.push("  "+fk(sk)+": "+fv(obj[k][sk]));}
return lines.join("\n")+"\n";}

// ============ 5. 预览 ============
function preview(input){var rules=[];var text=(input||"").trim();if(!text)return{moraOutputs:[],rules:[]};
var tokens=text.split(/\s+/).filter(function(x){return x;});
var pm=getPMap();var result=[];var i=0;
while(i<tokens.length){var matched=false;
for(var len=Math.min(4,tokens.length-i);len>=2;len--){
var pattern=tokens.slice(i,i+len).join(" ");
if(pm[pattern]){rules.push("多音字："+pattern+" → "+pm[pattern]);
result.push({token:pm[pattern].split(" "),isRule:true});i+=len;matched=true;break;}}
if(!matched){result.push({token:[tokens[i]],isRule:false});i++;}}
var fp=getFPMap();var outputs=[];var flat=[];
for(var j=0;j<result.length;j++){
var item=result[j];
for(var t=0;t<item.token.length;t++){
var tok=item.token[t];
if(hasKana(tok)){outputs.push({moras:[tok],isRule:item.isRule});continue;}
var parsed=parsePinyin(tok);
if(!parsed){outputs.push({moras:null,orig:tok,isRule:item.isRule});continue;}
var cc=parsed.length>1?parsed.slice(0,-1):[];var v=parsed[parsed.length-1];
var moras=genMoras(cc,v,fp);outputs.push({moras:moras,isRule:item.isRule});}}
return{moraOutputs:outputs,rules:rules};}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function renderPreview(){var input=document.getElementById("preview-input").value;
var out=document.getElementById("preview-output");var rulesBox=document.getElementById("preview-rules");
try{var r=preview(input);var parts=[];
for(var i=0;i<r.moraOutputs.length;i++){var item=r.moraOutputs[i];
if(item.moras===null)parts.push('<span class="err">[无法解析：'+esc(item.orig)+']</span>');
else{var cls=item.isRule?"phoneme rule":"phoneme";
parts.push('<span class="'+cls+'">'+item.moras.map(esc).join(" ")+'</span>');}}
out.innerHTML=parts.join('<span class="sep">/</span>');
rulesBox.innerHTML=r.rules.length?r.rules.map(esc).join("<br>"):"(无特殊规则命中)";}
catch(e){out.textContent="错误："+e.message;rulesBox.textContent="";}}

// ============ 6. 表单绑定 ============
function cfgToForm(){document.getElementById("cfg-nasal-mode").value=config.nasal_mode;
document.getElementById("cfg-nasal-ms").value=config.nasal_ms;
document.getElementById("cfg-use-wildcard").checked=config.use_wildcard;
document.getElementById("cfg-disable-vcv").checked=config.disable_vcv;
document.getElementById("cfg-disable-light-tone").checked=config.disable_light_tone;
document.getElementById("cfg-disable-tone-timing").checked=config.disable_tone_timing;
document.getElementById("cfg-disable-double-char").checked=config.disable_double_char;
renderTable("tbl-fullpinyin",config.full_pinyin,"pinyin");
renderTable("tbl-polyphone",config.polyphones,"polyphone");
renderTable("tbl-alias",config.alias_overrides,"alias");}

function formToCfg(){config.nasal_mode=document.getElementById("cfg-nasal-mode").value;
config.nasal_ms=+document.getElementById("cfg-nasal-ms").value||120;
config.use_wildcard=document.getElementById("cfg-use-wildcard").checked;
config.disable_vcv=document.getElementById("cfg-disable-vcv").checked;
config.disable_light_tone=document.getElementById("cfg-disable-light-tone").checked;
config.disable_tone_timing=document.getElementById("cfg-disable-tone-timing").checked;
config.disable_double_char=document.getElementById("cfg-disable-double-char").checked;}

function fmtVal(v,type){if(type==="alias"&&Array.isArray(v))return v.join(", ");
if(type==="pinyin"&&Array.isArray(v))return v.join(" ");return v;}

function renderTable(id,obj,type){var tbody=document.querySelector("#"+id+" tbody");tbody.innerHTML="";
for(var k in obj){var tr=document.createElement("tr");
var td1=document.createElement("td");var inp1=document.createElement("input");
inp1.type="text";inp1.value=k;inp1.dataset.key=k;inp1.dataset.role="key";
td1.appendChild(inp1);
var td2=document.createElement("td");var inp2=document.createElement("input");
inp2.type="text";inp2.value=fmtVal(obj[k],type);inp2.dataset.key=k;inp2.dataset.role="val";
td2.appendChild(inp2);
var td3=document.createElement("td");var del=document.createElement("span");
del.className="del";del.dataset.key=k;del.textContent="×";td3.appendChild(del);
tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tbody.appendChild(tr);
(function(key,inpK,inpV){inpK.addEventListener("change",function(){if(inpK.value===key||!inpK.value)return;
obj[inpK.value]=obj[key];delete obj[key];renderTable(id,obj,type);updateYaml();renderPreview();});
inpV.addEventListener("change",function(){
if(type==="pinyin")obj[key]=inpV.value.split(/\s+/).filter(function(x){return x;});
else if(type==="alias")obj[key]=inpV.value.split(/\s*,\s*/).filter(function(x){return x;});
else obj[key]=inpV.value;updateYaml();renderPreview();});
del.addEventListener("click",function(){delete obj[key];renderTable(id,obj,type);updateYaml();renderPreview();});})(k,inp1,inp2);}}

document.getElementById("btn-add-fullpinyin").addEventListener("click",function(){config.full_pinyin["new_pinyin"]=["new_mora"];renderTable("tbl-fullpinyin",config.full_pinyin,"pinyin");updateYaml();});
document.getElementById("btn-add-polyphone").addEventListener("click",function(){config.polyphones["new pattern"]="new replacement";renderTable("tbl-polyphone",config.polyphones,"polyphone");updateYaml();});
document.getElementById("btn-add-alias").addEventListener("click",function(){config.alias_overrides["new_kana"]=["candidate1"];renderTable("tbl-alias",config.alias_overrides,"alias");updateYaml();});

// ============ 7. YAML 同步 ============
function buildYamlObj(){var o={nasal_mode:config.nasal_mode,nasal_ms:config.nasal_ms,use_wildcard:config.use_wildcard,disable_vcv:config.disable_vcv,disable_light_tone:config.disable_light_tone,disable_tone_timing:config.disable_tone_timing,disable_double_char:config.disable_double_char};
var k;var has=false;for(k in config.full_pinyin)has=true;if(has)o.full_pinyin=config.full_pinyin;
has=false;for(k in config.polyphones)has=true;if(has)o.polyphones=config.polyphones;
has=false;for(k in config.alias_overrides)has=true;if(has)o.alias_overrides=config.alias_overrides;
return o;}

function updateYaml(){formToCfg();document.getElementById("yaml-editor").value=yamlDump(buildYamlObj());}

document.getElementById("btn-apply-yaml").addEventListener("click",function(){
var text=document.getElementById("yaml-editor").value;var s=document.getElementById("yaml-status");
try{var o=yamlParse(text)||{};
config.nasal_mode=o.nasal_mode||"short";config.nasal_ms=o.nasal_ms||120;
config.use_wildcard=o.use_wildcard!==false;config.disable_vcv=!!o.disable_vcv;
config.disable_light_tone=!!o.disable_light_tone;config.disable_tone_timing=!!o.disable_tone_timing;
config.disable_double_char=!!o.disable_double_char;
config.full_pinyin=o.full_pinyin||{};config.polyphones=o.polyphones||{};config.alias_overrides=o.alias_overrides||{};
cfgToForm();s.textContent="✓ 已应用";s.style.color="#4ec9b0";renderPreview();}
catch(e){s.textContent="✗ "+e.message;s.style.color="#f48771";}});

document.getElementById("btn-refresh-yaml").addEventListener("click",function(){updateYaml();
var s=document.getElementById("yaml-status");s.textContent="✓ 已刷新";s.style.color="#4ec9b0";});

document.getElementById("btn-export").addEventListener("click",function(){updateYaml();
var yaml=document.getElementById("yaml-editor").value;
var blob=new Blob([yaml],{type:"text/yaml;charset=utf-8"});
var url=URL.createObjectURL(blob);var a=document.createElement("a");
a.href=url;a.download="zh2ja.yaml";a.click();URL.revokeObjectURL(url);});

document.getElementById("btn-import").addEventListener("click",function(){document.getElementById("file-input").click();});

document.getElementById("file-input").addEventListener("change",function(e){
var f=e.target.files[0];if(!f)return;var r=new FileReader();
r.onload=function(ev){document.getElementById("yaml-editor").value=ev.target.result;
document.getElementById("btn-apply-yaml").click();};
r.readAsText(f,"utf-8");e.target.value="";});

// ============ 8. Tab 切换 ============
var tabs=document.querySelectorAll(".tab");
for(var i=0;i<tabs.length;i++){(function(t){t.addEventListener("click",function(){
for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("active");
t.classList.add("active");
var panes=document.querySelectorAll(".pane");
for(var j=0;j<panes.length;j++)panes[j].classList.remove("active");
document.querySelector('.pane[data-pane="'+t.dataset.pane+'"]').classList.add("active");});})(tabs[i]);}

document.getElementById("preview-input").addEventListener("input",renderPreview);

// 初始化
cfgToForm();
updateYaml();
renderPreview();
</script>
